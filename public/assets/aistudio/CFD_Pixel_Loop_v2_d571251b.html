<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CFD Pixel Loop</title>
<style>
:root{--bg:#eef1f6;--fg:#1b2433;--bd:#1b2433;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f18;--fg:#d6deec;--bd:#7ee7ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f18;--fg:#d6deec;--bd:#7ee7ff;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.frame{width:min(88vw,420px);aspect-ratio:1/1;border:4px solid var(--bd);box-shadow:6px 6px 0 var(--bd);background:#000;cursor:pointer}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.bar{width:min(88vw,420px);height:4px;background:color-mix(in srgb,var(--fg) 20%,transparent)}
.bar i{display:block;height:100%;width:0;background:var(--bd)}
.cap{width:min(88vw,420px);font-size:12px;letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;background:var(--fg);opacity:.25}
.dots i.on{opacity:1}
</style>
</head>
<body>

<div class="frame" id="f" title="Click to pause or play">
<canvas id="c" width="192" height="192"></canvas>
</div>

<div class="bar"><i id="p"></i></div>
<div class="cap">
<span id="t">Mesh</span>
<span class="dots"><i></i><i></i><i></i><i></i></span>
</div>

<script>
try {
  const qp = new URLSearchParams(window.location.search);
  if (qp.get('transparent') === '1' || qp.has('transparent')) {
    document.documentElement.style.setProperty('--bg', 'transparent');
    document.body.style.background = 'transparent';
  }
  if (qp.get('theme')) {
    document.documentElement.setAttribute('data-theme', qp.get('theme'));
  }
} catch (e) {}

const W=192,c=document.getElementById('c'),x=c.getContext('2d');
x.imageSmoothingEnabled=false;

const R=(a,b,w,h,k)=>{
  x.fillStyle=k;
  x.fillRect(Math.round(a),Math.round(b),Math.round(w),Math.round(h));
};

const L=(a,b,p,q,k,th=1)=>{
  const n=Math.max(Math.abs(p-a),Math.abs(q-b),1);
  for(let i=0;i<=n;i++)
    R(a+(p-a)*i/n-th/2,b+(q-b)*i/n-th/2,th,th,k);
};

const rnd=n=>{
  const v=Math.sin(n*127.1)*43758.5453;
  return v-Math.floor(v);
};

const hex=h=>[
  parseInt(h.slice(1,3),16),
  parseInt(h.slice(3,5),16),
  parseInt(h.slice(5,7),16)
];

const BY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

const RAMP=[
  '#2f6bff','#27c3ff','#31e6a0',
  '#ffe14d','#ff9a3c','#ff4b4b'
];

const ease=t=>1-Math.pow(1-Math.min(1,Math.max(0,t)),3);

// 3x5 pixel font
const G={
0:'111101101101111',
1:'010110010010111',
2:'111001111100111',
3:'111001111001111',
4:'101101111001001',
5:'111100111001111',
6:'111100111101111',
7:'111001001001001',
8:'111101111101111',
9:'111101111001111',
'.':'000000000000010',
C:'111100100100111',
L:'100100100100111',
D:'110101101101110',
'/':'001001010100100',
X:'101101010101101',
Z:'111001010100111'
};

function T(str,px,py,k,sc=1){
  for(const ch of String(str)){
    const g=G[ch];
    if(!g)continue;
    const w=ch=='.'?1:3;
    for(let r=0;r<5;r++)
      for(let q=0;q<3;q++)
        if(g[r*3+q]=='1'&&(ch!='.'||q==1))
          R(px+(ch=='.'?0:q)*sc,py+r*sc,sc,sc,k);
    px+=(w+1)*sc;
  }
}

// Dithered gradient backgrounds
function mkBG(stops,grid){
  const o=document.createElement('canvas');
  o.width=o.height=W;
  const g=o.getContext('2d');
  const im=g.createImageData(W,W),d=im.data,S=stops.map(hex);

  for(let y=0;y<W;y++)
    for(let X=0;X<W;X++){
      const t=y/(W-1)*(S.length-1);
      const i=Math.min(S.length-2,Math.floor(t));
      const f=t-i,b=BY[(y&3)*4+(X&3)]/16;
      let col=S[f>b?i+1:i];
      const dd=Math.hypot(X-96,y-96)/136;

      if(dd>.6&&(dd-.6)*2.4>b)
        col=col.map(v=>v*.6);

      if(grid&&(X%16==0||y%16==0))
        col=col.map(v=>Math.min(255,v+16));

      const k=(y*W+X)*4;
      d[k]=col[0];
      d[k+1]=col[1];
      d[k+2]=col[2];
      d[k+3]=255;
    }

  g.putImageData(im,0,0);
  return o;
}

const BG={
  a:mkBG(['#0a1630','#0b1d3d','#07101f'],1),
  b:mkBG(['#050c1a','#0a1a30','#06101f']),
  c:mkBG(['#1b1233','#120c24','#080512']),
  d:mkBG(['#06222a','#0a2f36','#06181d'],1)
};

// Airfoil polygon
const CH=88,AOA=-.16;

function foilPts(n){
  const a=[];
  for(let i=0;i<=n;i++){
    const b=Math.PI*2*i/n;
    const xc=(1+Math.cos(b))/2;
    const sg=i<=n/2?1:-1;
    const yt=5*.14*(.2969*Math.sqrt(xc)-.126*xc-
      .3516*xc*xc+.2843*xc**3-.1015*xc**4);
    const px=(xc-.5)*CH,py=-sg*yt*CH;
    const co=Math.cos(AOA),si=Math.sin(AOA);
    a.push([96+px*co-py*si,96+px*si+py*co]);
  }
  return a;
}

const FP=foilPts(48),MASK=new Uint8Array(W*W);

for(let y=60;y<132;y++)
  for(let X=30;X<162;X++){
    let ins=false;
    for(let i=0,j=FP.length-1;i<FP.length;j=i++){
      const[xi,yi]=FP[i],[xj,yj]=FP[j];
      if((yi>y)!=(yj>y)&&X<(xj-xi)*(y-yi)/(yj-yi)+xi)
        ins=!ins;
    }
    MASK[y*W+X]=ins?1:0;
}

function sprite(hi,lo,edge){
  const o=document.createElement('canvas');
  o.width=o.height=W;
  const g=o.getContext('2d'),im=g.createImageData(W,W),d=im.data;
  const [h,l,e]=[hi,lo,edge].map(hex);

  for(let y=1;y<W-1;y++)
    for(let X=1;X<W-1;X++){
      if(!MASK[y*W+X])continue;
      const ed=!MASK[y*W+X-1]||!MASK[y*W+X+1]||
        !MASK[(y-1)*W+X]||!MASK[(y+1)*W+X];
      const up=y<96+(X-96)*Math.tan(AOA);
      const hl=!ed&&!MASK[(y-2)*W+X]&&up;
      const col=ed?e:hl?[255,255,255]:up?h:l;
      const k=(y*W+X)*4;
      d[k]=col[0];
      d[k+1]=col[1];
      d[k+2]=col[2];
      d[k+3]=255;
    }

  g.putImageData(im,0,0);
  return o;
}

const FOIL={
  dark:sprite('#13294a','#0b1830','#7ee7ff'),
  metal:sprite('#a9bdd2','#5a6f8a','#0a1220')
};

// Dust particles
const MO=Array.from({length:28},(_,i)=>({
  x:rnd(i)*W,
  y:rnd(i+50)*W,
  v:4+rnd(i+9)*10
}));

const dust=()=>MO.forEach(m=>R(m.x,m.y,1,1,'rgba(190,225,255,.35)'));

// SCENE 1 - MESH
const DIR=FP.map(p=>{
  const dx=p[0]-96,dy=p[1]-96,l=Math.hypot(dx,dy);
  return[dx/l,dy/l];
});

function sA(s,dt){
  x.drawImage(BG.a,0,0);
  dust();
  const prog=Math.min(1,s/3.8),LY=12,sh=prog*LY,n=FP.length-1;

  const M=(i,j)=>{
    const d=1.4*Math.pow(1.34,j);
    return[
      FP[i][0]+DIR[i][0]*d,
      FP[i][1]+DIR[i][1]*d
    ];
  };

  for(let j=0;j<=Math.floor(sh);j++){
    const col=j<2?'#9be7ff':j<5?'#4fb0e0':
      j<8?'#2b7bb5':'#1d4f80';

    for(let i=0;i<n;i++){
      const a=M(i,j),b=M(i+1,j);
      L(a[0],a[1],b[0],b[1],col);

      if(j>0){
        const q=M(i,j-1);
        if(i%2==0||j<5)
          L(a[0],a[1],q[0],q[1],col);
      }
    }
  }

  x.drawImage(FOIL.dark,0,0);
  x.fillStyle='rgba(126,231,255,.18)';
  x.fillRect((s*46)%210-6,0,3,W);
  R((s*46)%210-3,0,1,W,'#7ee7ff');

  for(let a=0;a<2;a++)
    for(let b=0;b<2;b++)
      R(12+a*4,172+b*4,3,3,b?'#4fb0e0':'#9be7ff');

  T(String(Math.floor(ease(prog)*1284000)).padStart(7,'0'),
    26,171,'#d6f3ff',2);
}

// SCENE 2 - SOLVE
let PT=[];
const K=6,A0=44;

function spawn(p,r){
  p.x=r?rnd(p.i*3.1)*W:-4;
  p.y=10+(r?rnd(p.i*5.7):Math.random())*172;
}

function vel(rx,ry){
  const co=Math.cos(AOA),si=Math.sin(AOA);
  const fx=rx*co+ry*si,fy=(-rx*si+ry*co),Y=fy*K;
  const r2=fx*fx+Y*Y,a2=A0*A0;
  if(r2<a2*1.02)return null;

  const r4=r2*r2;
  const Ux=Math.cos(AOA),Uy=-Math.sin(AOA),G=46;

  let u=Ux*(1-a2*(fx*fx-Y*Y)/r4)-
    Uy*a2*2*fx*Y/r4-G*Y/r2;

  let v=-Ux*a2*2*fx*Y/r4+
    Uy*(1+a2*(fx*fx-Y*Y)/r4)+G*fx/r2;

  v/=K;
  return[u*co-v*si,u*si+v*co];
}

function sB(s,dt){
  if(s<.12){
    x.drawImage(BG.b,0,0);
  }else{
    x.globalAlpha=.2;
    x.drawImage(BG.b,0,0);
    x.globalAlpha=1;
  }

  if(!PT.length)
    PT=Array.from({length:230},(_,i)=>{
      const p={i};spawn(p,1);return p;
    });

  for(const p of PT){
    const v=vel(p.x-96,p.y-96);
    if(!v){spawn(p,0);continue}

    const sp=Math.hypot(v[0],v[1]);
    p.x+=v[0]*78*dt;
    p.y+=v[1]*78*dt;

    if(p.x>W+4||p.y<-4||p.y>W+4)
      spawn(p,0);

    R(p.x,p.y,1,1,
      RAMP[Math.max(0,Math.min(5,Math.floor((sp-.55)/.9*6)))]);
  }

  x.drawImage(FOIL.metal,0,0);

  for(let i=0;i<W;i+=8){
    R(i,0,4,12,'#1a2a44');
    R(i+4,0,4,12,'#ffc83d');
    R(i,W-12,4,12,'#ffc83d');
    R(i+4,W-12,4,12,'#1a2a44');
  }

  R(0,12,W,2,'#0a1220');
  R(0,W-14,W,2,'#0a1220');

  for(let i=0;i<6;i++)
    R(60+i*12,W-9,12,5,RAMP[i]);

  R(58,W-10,1,7,'#fff');
  R(132,W-10,1,7,'#fff');
}

// SCENE 3 - ANALYZE
function sC(s,dt){
  x.drawImage(BG.c,0,0);
  dust();

  const prog=Math.min(1,s/4.2);

  R(10,10,172,116,'#2b3347');
  R(10,10,172,2,'#4a5878');
  R(14,14,164,108,'#070d1a');
  R(86,126,20,8,'#2b3347');
  R(70,132,52,3,'#3a4560');
  R(22,24,1,76,'#3a4a6a');
  R(22,99,92,1,'#3a4a6a');

  for(let g=1;g<6;g++)
    for(let q=24;q<112;q+=4)
      R(q,24+g*13,1,1,'#1c2a46');

  const cols=['#ff6ec7','#7ee7ff','#ffe14d'];

  for(let k=0;k<3;k++){
    let pr=null;
    for(let i=0;i<=Math.floor(prog*88);i++){
      const y=30+(i/88)*(52+k*5)+
        rnd(i*3+k)*5*Math.exp(-i/28);
      const pt=[24+i,y];
      if(pr)L(pr[0],pr[1],pt[0],pt[1],cols[k]);
      pr=pt;
    }
  }

  R(118,24,56,76,'#0e1830');
  R(118,24,56,1,'#27406e');

  const rows=[['CL',1.248,3],['CD',.018,3],['L/D',68.6,1]];

  rows.forEach((r,i)=>{
    const y0=28+i*24;
    T(r[0],122,y0,'#7a93c0');
    T((r[1]*ease(prog)).toFixed(r[2]),
      122,y0+8,i==2?'#ffe14d':'#7ee7ff',2);
  });

  for(let i=0;i<12;i++){
    const h=(rnd(i)*.6+.3)*18*ease(prog)*
      (.75+.25*Math.sin(s*2.4+i));
    R(24+i*7.5,120-h,5,h,
      RAMP[Math.min(5,Math.floor(h/18*6))]);
  }

  R(0,138,W,54,'#1d1630');
  R(0,138,W,3,'#3a2c58');
  R(0,140,W,5,'#2a2044');

  R(52,128,60,6,'#3b4766');
  for(let i=0;i<14;i++)
    R(54+i*4,129,3,2,'#5a6a90');

  // Mug and steam
  R(18,126,10,10,'#e8e8f0');
  R(28,129,3,5,'#e8e8f0');
  R(20,128,6,2,'#6b3a1e');

  for(let i=0;i<3;i++)
    R(21+Math.sin(s*2+i)*2+i*2,
      118-i*4-((s*8)%4),1,2,'rgba(255,255,255,.4)');

  // Cat
  const tw=Math.sin(s*2.4)*5;
  R(138,116,34,14,'#e8923c');
  R(140,112,12,8,'#e8923c');
  R(140,109,3,4,'#e8923c');
  R(149,109,3,4,'#e8923c');
  R(141,110,1,2,'#ff9ab0');

  for(let i=0;i<3;i++)
    R(150+i*5,116,2,6,'#b5611f');

  R(143,116,5,1,'#2a1a10');
  L(172,126,180+tw,118,'#e8923c',4);
  L(180+tw,118,182+tw,110,'#b5611f',3);

  if(Math.sin(s*2)>-.2)
    T('Z',176,98-((s*6)%6),'#cfe6ff');

  // Plant
  R(150,160,18,24,'#7a4a2e');
  R(148,158,22,4,'#8a5a3a');

  for(let k=0;k<6;k++)
    L(159,158,
      146+k*6+Math.sin(s*1.8+k)*2,
      134+(k%3)*6,'#2f9e5a',3);

  R(8,160,2,0,'#000');
}

// SCENE 4 - EXPORT
function sD(s,dt){
  x.drawImage(BG.d,0,0);
  dust();

  const prog=Math.min(1,s/3.4);

  R(16,16,130,112,'#e9eef5');
  R(16,16,130,11,'#21a366');

  for(let i=0;i<3;i++)
    R(21+i*6,20,3,3,'#e9fff3');

  R(16,27,130,9,'#cfd8e3');

  const x0=30,y0=38;

  for(let r=0;r<8;r++){
    R(16,y0+r*10,12,10,'#cfd8e3');

    for(let q=0;q<5;q++){
      const idx=r*5+q;
      R(x0+q*23,y0+r*10,23,1,'#b7c3d1');
      R(x0+q*23,y0,1,80,'#b7c3d1');

      if(idx<prog*40)
        T(String(Math.floor(rnd(idx*1.7)*900+100)),
          x0+q*23+5,y0+r*10+3,'#1a2a3a');
    }
  }

  R(16,y0+80,130,1,'#b7c3d1');

  R(92,70,86,62,'#ffffff');
  R(92,70,86,2,'#185c37');
  R(92,130,86,2,'#185c37');
  R(92,70,2,62,'#185c37');
  R(176,70,2,62,'#185c37');

  for(let g=0;g<4;g++)
    R(98,80+g*13,74,1,'#dfe6ee');

  const cp=ease((s-1.2)/2.2);
  let pr=null;

  for(let i=0;i<=Math.floor(cp*70);i++){
    const pt=[
      100+i,
      122-(Math.sin(i/9)*8+i*.5+
      12*(1-Math.exp(-i/25)))
    ];
    if(pr)L(pr[0],pr[1],pt[0],pt[1],'#21a366',2);
    pr=pt;
  }

  const b=Math.abs(Math.sin(s*5))*3;

  R(20,142,24,30,'#21a366');
  R(36,142,8,8,'#185c37');
  T('X',26,153,'#fff',3);

  R(29,134+b,4,9,'#ffe14d');
  R(26,142+b,10,2,'#ffe14d');
  R(28,144+b,6,2,'#ffe14d');
  R(30,146+b,2,2,'#ffe14d');

  R(54,154,104,8,'#0a1a20');
  R(55,155,102*ease(s/3.6),6,'#21a366');
  R(54,154,104,1,'#4fe0a0');

  T(String(Math.floor(ease(s/3.6)*100)),164,155,'#d6f3ff');

  if(s>3.8){
    const a=s-3.8;
    for(let i=0;i<34;i++){
      const an=rnd(i)*6.28;
      const r=a*(30+rnd(i+7)*50);
      R(31+Math.cos(an)*r,
        150+Math.sin(an)*r+a*a*40,
        2,2,RAMP[i%6]);
    }
  }
}

// MAIN LOOP
const S=[sA,sB,sC,sD];
const N=['Mesh','Solve','Analyze','Export'];
const D=6;
const dots=[...document.querySelectorAll('.dots i')];
const cap=document.getElementById('t');
const bar=document.getElementById('p');

let paused=false,t=0,last=null,cur=-1;

document.getElementById('f').onclick=()=>paused=!paused;

function frame(now){
  if(last===null)last=now;

  const dt=Math.max(0,Math.min(.05,(now-last)/1000));
  last=now;

  if(!paused)t+=dt;

  for(const m of MO){
    if(!paused)m.y-=m.v*dt;
    if(m.y<0)m.y=W;
  }

  const i=Math.floor(t/D)%4,s=t%D;
  S[i](s,paused?0:dt);

  const tr=.6;
  const p=s<tr?1-s/tr:s>D-tr?(s-(D-tr))/tr:0;

  if(p>0)
    for(let q=0;q<256;q++)
      if(rnd(q*7.3+i)<p)
        R((q%16)*12,Math.floor(q/16)*12,12,12,'#04070d');

  x.fillStyle='rgba(0,0,0,.09)';
  for(let y=0;y<W;y+=2)
    x.fillRect(0,y,W,1);

  if(i!==cur){
    cur=i;
    cap.textContent=N[i];
    dots.forEach((d,k)=>d.classList.toggle('on',k===i));
  }

  bar.style.width=(s/D*100)+'%';
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
